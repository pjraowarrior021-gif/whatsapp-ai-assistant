name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    name: Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
        os: [ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit dependencies
        run: npm audit --audit-level=high

      - name: Check code formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run Test Suite
        run: |
          node --test tests/*.test.js > test-results.log 2>&1 || {
            echo "## ❌ Test Suite Failures ($MATRIX_NAME)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 60 test-results.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat test-results.log
            exit 1
          }
        env:
          NODE_ENV: test
          TZ: 'Asia/Kolkata'
          TIMEZONE: 'Asia/Kolkata'
          MATRIX_NAME: 'Node ${{ matrix.node-version }}'
          WHATSAPP_TOKEN: 'mock_test_token'
          WHATSAPP_PHONE_NUMBER_ID: '123456789012345'
          WHATSAPP_VERIFY_TOKEN: 'mock_verify_token'
          WHATSAPP_APP_SECRET: 'mock_test_secret'
          ALLOWED_PHONE_NUMBERS: '919876543210,910000000000'
          GEMINI_API_KEY: 'mock_test_gemini_key'

      - name: Run Performance Benchmark (non-blocking)
        run: npm run benchmark
        continue-on-error: true

  docker-build:
    name: Verify Docker Container Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: whatsapp-ai-assistant:test
